            - coordinator coordinator  --bucket-name=vectors  --create-bucket-if-not-exists=true  --db-address=pg.databases.svc.cluster.local  --db-name=chroma_sysdb  --db-port=6432  --kubernetes-namespace=team-a  --password=$PG_PASSWORD  --read-db-address=pg.databases.svc.cluster.local  --s3-access-key-id=  --s3-endpoint=  --s3-force-path-style=true  --s3-region=eu-west-1  --s3-secret-access-key=  --ssl-mode=require  --username=$PG_USERNAME  --version-file-enabled=true 
          env:
            
            - name: OPTL_TRACING_ENDPOINT
              # TODO properly use flow control here to check which type of value we need.

              value: "otel-collector.team-a.svc.cluster.local:4317"
            
            - name: PG_USERNAME
              # TODO properly use flow control here to check which type of value we need.

              valueFrom:
                secretKeyRef: {name: team-a-pg, key: username}
              
            
            - name: PG_PASSWORD
              # TODO properly use flow control here to check which type of value we need.

              valueFrom:
                secretKeyRef: {name: team-a-pg, key: password}
              
            
            - name: AWS_ACCESS_KEY_ID
              # TODO properly use flow control here to check which type of value we need.

              valueFrom:
                secretKeyRef: {name: team-a-s3, key: accessKeyId}
              
            
            - name: AWS_SECRET_ACCESS_KEY
              # TODO properly use flow control here to check which type of value we need.

              valueFrom:
                secretKeyRef: {name: team-a-s3, key: secretAccessKey}
              
            
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: "registry.example.com/mirror/sysdb-service:52ce844"
          imagePullPolicy: IfNotPresent
          readinessProbe:
            periodSeconds: 1
            failureThreshold: 30 # 30 seconds to allow for initial startup
            grpc:
              port: 50051
          name: sysdb
          ports:
            - containerPort: 50051
              name: grpc
          resources:
            limits:
              cpu: 100m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      
      tolerations:
        
        - effect: NoSchedule

      labels:
        app: rust-log-service
        member-type: rust-log-service
    spec:
      serviceAccountName: rust-log-service-serviceaccount
      volumes:
        
        - name: rust-log-service-config
          configMap:
            name: rust-log-service-config
        
        
        - name: rust-log-service-cache
          hostPath:
            path: /local/cache/chroma-log-service
            type: DirectoryOrCreate
        
        
      containers:
        - name: rust-log-service
          
          image: "registry.example.com/mirror/rust-log-service:52ce844"
          imagePullPolicy: IfNotPresent
          readinessProbe:
            periodSeconds: 5
            failureThreshold: 30 # 30 seconds to allow for initial startup
            grpc:
              port: 50051
          volumeMounts:
            
            - name: rust-log-service-config
              mountPath: /config/
            
            
            - name: rust-log-service-cache
              mountPath: /cache/
            
            
          ports:
            - containerPort: 50051
          env:
            - name: CONFIG_PATH
              value: "/config/config.yaml"
            - name: CHROMA_LOG_SERVICE__MY_MEMBER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            
              
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: team-a-s3, key: accessKeyId}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: team-a-s3, key: secretAccessKey}
            - name: AWS_REGION
              value: "eu-west-1"
            
            
          
          resources:
            limits:
              cpu: 200m
              memory: 768Mi
            requests:
              cpu: 200m
              memory: 512Mi
          
      
      
      
      affinity:
        
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: rust-log-service
              topologyKey: kubernetes.io/hostname
            weight: 100
      
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              member-type: rust-log-service

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: compaction-service
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compaction-service
  template:
    metadata:
      labels:
        app: compaction-service
        member-type: compaction-service
    spec:
      serviceAccountName: compaction-service-serviceaccount
      volumes:
        
        - name: compaction-service-config
          configMap:
            name: compaction-service-config
        
        
        - name: compaction-service-cache
          hostPath:
            path: /local/cache/chroma-compaction-service
            type: DirectoryOrCreate
        
      containers:
        - name: compaction-service
          image: "registry.example.com/mirror/compactor-service:52ce844"
          imagePullPolicy: IfNotPresent
          readinessProbe:
            periodSeconds: 1
            failureThreshold: 30 # 30 seconds to allow for initial startup
            grpc:
              port: 50051
          volumeMounts:
            
            - name: compaction-service-config
              mountPath: /config/
            
            
            - name: compaction-service-cache
              mountPath: /cache/
            
          ports:
            - containerPort: 50051
            - containerPort: 6060
              protocol: TCP
              name: pprof
          env:
            
            - name: CONFIG_PATH
              value: /config/config.yaml
            
            
            - name: RUST_BACKTRACE
              # TODO properly use flow control here to check which type of value we need.

              value: "1"
            
            - name: AWS_ACCESS_KEY_ID
              # TODO properly use flow control here to check which type of value we need.

              valueFrom:
                secretKeyRef: {name: team-a-s3, key: accessKeyId}
              
            
            - name: AWS_SECRET_ACCESS_KEY
              # TODO properly use flow control here to check which type of value we need.

              valueFrom:
                secretKeyRef: {name: team-a-s3, key: secretAccessKey}
              
            
            - name: AWS_REGION
              # TODO properly use flow control here to check which type of value we need.

              value: "eu-west-1"
            
            
            - name: CHROMA_COMPACTION_SERVICE__MY_MEMBER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          
          resources:
            limits:
              cpu: 200m
              memory: 1536Mi
            requests:
              cpu: 200m
              memory: 768Mi
          
      
      tolerations:
        
        - effect: NoSchedule
          key: avx512
          operator: Exists
      
      
      nodeSelector:
        
        pool: avx512
      
      
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              member-type: compaction-service

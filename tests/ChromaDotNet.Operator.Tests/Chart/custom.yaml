---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fn-consumer
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fn-consumer
  template:
    metadata:
      labels:
        app: fn-consumer
        member-type: fn-consumer
    spec:
      serviceAccountName: fn-consumer-service-account
      volumes:
        
        - name: fn-consumer-config
          configMap:
            name: fn-consumer-config
        
      containers:
        - name: fn-consumer
          image: "registry.example.com/mirror/fn-consumer-service:52ce844"
          imagePullPolicy: IfNotPresent
          readinessProbe:
            periodSeconds: 1
            failureThreshold: 30 # 30 seconds to allow for initial startup
            grpc:
              port: 50051
          volumeMounts:
            
            - name: fn-consumer-config
              mountPath: /config/
            
          ports:
            - containerPort: 50051
              protocol: TCP
              name: grpc
          env:
            
            - name: CONFIG_PATH
              value: /config/config.yaml
            
            
            - name: RUST_BACKTRACE
              # TODO properly use flow control here to check which type of value we need.

              value: "1"
            
            - name: AWS_ACCESS_KEY_ID
              # TODO properly use flow control here to check which type of value we need.

              valueFrom:
                secretKeyRef: {name: team-a-s3, key: accessKeyId}
              
            
            - name: AWS_SECRET_ACCESS_KEY
              # TODO properly use flow control here to check which type of value we need.

              valueFrom:
                secretKeyRef: {name: team-a-s3, key: secretAccessKey}
              
            
            - name: AWS_REGION
              # TODO properly use flow control here to check which type of value we need.

              value: "eu-west-1"
            
            - name: CHROMA_FN_CONSUMER_SERVICE__MY_MEMBER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          
          resources:
            limits:
              cpu: 200m
              memory: 768Mi
            requests:
              cpu: 200m
              memory: 384Mi
          
      
      
      nodeSelector:
        
        pool: frontend
      
      
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              member-type: fn-consumer

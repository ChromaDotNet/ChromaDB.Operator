# Source: distributed-chroma/templates/rust-frontend-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-frontend-service
  namespace: team-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rust-frontend-service
  template:
    metadata:
      labels:
        app: rust-frontend-service
    spec:
      serviceAccountName: rust-frontend-service-serviceaccount
      containers:
        - name: rust-frontend-service
          
          command: ["chroma", "run", "$(CONFIG_PATH)"]
          
          image: "registry.example.com/mirror/rust-frontend-service-oss:52ce844"
          imagePullPolicy: IfNotPresent
          readinessProbe:
            periodSeconds: 1
            failureThreshold: 30 # 30 seconds to allow for initial startup
            httpGet:
              port: 8000
              path: /api/v2/healthcheck
          ports:
            - containerPort: 8000
          
          resources:
            limits:
              cpu: 100m
              memory: 768Mi
            requests:
              cpu: 250m
              memory: 256Mi
          
          env:
            - name: CONFIG_PATH
              value: "/config/config.yaml"
            
              
            - name: RUST_BACKTRACE
              value: "1"
            
            
          
          volumeMounts:
            - name: rust-frontend-service-config
              mountPath: /config/
          

      
      
      nodeSelector:
        
        pool: frontend
      
      
      volumes:
        - name: rust-frontend-service-config
          configMap:
            name: rust-frontend-service-config

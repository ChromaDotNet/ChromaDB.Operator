apiVersion: apps/v1
kind: Deployment
metadata:
  name: sysdb
  namespace: team-a
  annotations:
  
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sysdb
  template:
    metadata:
      labels:
        app: sysdb
    spec:
      serviceAccountName: sysdb-serviceaccount
      containers:
        - command:
            - "/bin/sh"

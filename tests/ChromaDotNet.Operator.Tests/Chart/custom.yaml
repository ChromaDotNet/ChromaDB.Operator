  template:
    metadata:
      labels:
        app: sysdb-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - args: ['migrate', 'apply', '--url', 'postgres://$(PG_USERNAME):$(PG_PASSWORD)@pg.databases.svc.cluster.local:6432/chroma_sysdb?sslmode=require']

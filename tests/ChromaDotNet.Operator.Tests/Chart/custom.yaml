# Source: distributed-chroma/templates/rust-frontend-service.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: rust-frontend-service-config
  namespace: team-a
data:
  config.yaml: |
    # This file is an example of configuring the frontend for
    # distributed chroma. It is used in our Tiltfile as well.
    open_telemetry:
      service_name: "rust-frontend-service"
      endpoint: "http://otel-collector.team-a.svc.cluster.local:4317"
      filters:
        - crate_name: "chroma_frontend"
          filter_level: "trace"
    sysdb:
      grpc:
        host: "sysdb.team-a"
        port: 50051
        connect_timeout_ms: 60000
        request_timeout_ms: 60000
    collections_with_segments_provider:
      cache:
        lru:
          name: "collections_with_segments_cache"
          capacity: 1000
      cache_ttl_secs: 2
      permitted_parallelism: 180
      cache_invalidation_retry_policy:
        delay_ms: 0
        max_retries: 3
    log:
      grpc:
        host: "rust-log-service.team-a"
        port: 50051
        connect_timeout_ms: 5000
        request_timeout_ms: 60000 # 1 minute
        memberlist_provider:
          custom_resource:
            kube_namespace: "team-a"
            memberlist_name: "rust-log-service-memberlist"
            queue_size: 100
    
    executor:
      distributed:
        connections_per_node: 5
        replication_factor: 2
        connect_timeout_ms: 5000
        request_timeout_ms: 60000 # 1 minute
        assignment:
          rendezvous_hashing:
            hasher: Murmur3
        tiers:
          - tier: 0
            capacity: 4
            patterns:
              - all_of:
                  - tenant_id: "premium_tenant"
                  - collection_size:
                      min: 1000001
                      max: 18446744073709551615
          - tier: 1
            capacity: 5
            patterns:
              - collection_size:
                  min: 0
                  max: 10000
        memberlist_provider:
          custom_resource:
            kube_namespace: "team-a"
            memberlist_name: "query-service-memberlist"
            queue_size: 100
        client_selection:
          first_attempt_weights: [0.8, 0.2]
          uniform_on_retry: true
    scorecard_enabled: true
    scorecard:
      - patterns:
          - "op:read"
          - "collection:*"
        score: 10
      - patterns:
          - "op:write"
          - "collection:*"
        score: 10
    circuit_breaker:
      requests: 1000
    enable_span_indexing: true
    default_knn_index: "spann"
    enable_schema: true
    tenants_to_migrate_immediately:
    - "default_tenant"
    tenants_to_migrate_immediately_threshold: "ffffffff-ffff-ffff-ffff-ffffffffffff"
    tenants_with_quantization_enabled: []
    tenants_with_maxscore_enabled: []
    tenants_with_token_bitmap_fts_enabled: []
    tenants_with_transactions_enabled:
    - "default_tenant"
    enable_log_scouting: true
    enable_transactions: false

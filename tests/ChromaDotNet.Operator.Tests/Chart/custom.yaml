kind: StatefulSet
metadata:
  name: garbage-collector
  namespace: team-a
  labels:
    app: garbage-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garbage-collector
  template:
    metadata:
      labels:
        app: garbage-collector
        member-type: garbage-collection-service
    spec:
      serviceAccountName: garbage-collector-serviceaccount
      volumes:
        
        - name: garbage-collector-config
          configMap:
            name: garbage-collector-config
        
        
        - name: garbage-collector-cache
          hostPath:
            path: /local/cache/chroma-garbage-collector
            type: DirectoryOrCreate
        
      containers:
      - name: garbage-collector
        image: "registry.example.com/mirror/garbage-collector-service:52ce844"
        imagePullPolicy: IfNotPresent
        readinessProbe:
          periodSeconds: 1
          failureThreshold: 30 # 30 seconds to allow for initial startup
          grpc:
            port: 50055
        ports:
          - containerPort: 6060
            protocol: TCP
            name: pprof
        
        resources:
          limits:
            cpu: 100m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        
        volumeMounts:
          
          - name: garbage-collector-config
            mountPath: /config/
          
          
          - name: garbage-collector-cache
            mountPath: /cache/
          
        env:
          
          - name: _RJEM_MALLOC_CONF
            value: prof:true,prof_active:true,lg_prof_sample:19
          
          
          - name: CONFIG_PATH
            value: /config/config.yaml
          
          - name: CHROMA_GC_MY_MEMBER_ID
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          
          - name: RUST_BACKTRACE

            value: "1"
          
          - name: AWS_ACCESS_KEY_ID

            valueFrom:
              secretKeyRef: {name: team-a-s3, key: accessKeyId}
            
          
          - name: AWS_SECRET_ACCESS_KEY

            valueFrom:
              secretKeyRef: {name: team-a-s3, key: secretAccessKey}
            
          
          - name: AWS_REGION

            value: "eu-west-1"
          
      
      
      
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              member-type: garbage-collection-service

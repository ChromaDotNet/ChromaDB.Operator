# The case previous of build/chart.sh: the case default on the version before, 26e51e7 with the chart 0.1.93.
apiVersion: chroma.chromadotnet.org/v1alpha1
kind: Chroma
metadata:
  name: chroma
  namespace: chroma
spec:
  mode: distributed
  distributed:
    version: 26e51e7
    postgres:
      host: postgres
      credentialsSecret: {name: chroma-postgres}
    objectStorage:
      s3:
        endpoint: http://minio.chroma.svc.cluster.local:9000
        credentialsSecret: {name: chroma-storage}

# The case reset of build/chart.sh: the case default with the frontend that accepts reset, as values.dev.yaml of the chart has it.
apiVersion: chroma.chromadotnet.org/v1alpha1
kind: Chroma
metadata:
  name: chroma
  namespace: chroma
spec:
  mode: distributed
  distributed:
    version: 52ce844
    postgres:
      host: postgres
      credentialsSecret: {name: chroma-postgres}
    objectStorage:
      s3:
        endpoint: http://minio.chroma.svc.cluster.local:9000
        credentialsSecret: {name: chroma-storage}
    frontend:
      allowReset: true

# The external Postgres and S3 of the end-to-end tests of distributed Chroma, in the namespace of the test: Postgres, SeaweedFS with an
# S3 API without identities (it takes any key), the Secrets the Chroma names, and a Job that creates the bucket. Only for the tests: the
# data is in emptyDir volumes. SeaweedFS needs more volumes than its default 8, and below 1% of free disk it goes read-only
# (S3-SEAWEEDFS-MISURA.md).
apiVersion: v1
kind: Secret
metadata: {name: chroma-postgres}
stringData: {username: chroma, password: e2e-postgres-password}
---
apiVersion: v1
kind: Secret
metadata: {name: chroma-storage}
stringData: {accessKeyId: e2e, secretAccessKey: e2e-storage-secret}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.6-alpine
          imagePullPolicy: IfNotPresent
          env:
            - {name: POSTGRES_DB, value: sysdb}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: chroma-postgres, key: username}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: chroma-postgres, key: password}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          # On TCP: during the init the server answers on its socket only, then restarts.
          readinessProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, chroma, -d, sysdb]}, periodSeconds: 2}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: seaweedfs}
spec:
  selector: {matchLabels: {app: seaweedfs}}
  template:
    metadata: {labels: {app: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: docker.io/chrislusf/seaweedfs:4.48
          imagePullPolicy: IfNotPresent
          args: [server, -dir=/data, -s3, -s3.port=8333, -volume.max=100, -volume.minFreeSpace=0.1, -master.volumeSizeLimitMB=64]
          ports: [{containerPort: 8333}]
          readinessProbe: {tcpSocket: {port: 8333}, periodSeconds: 2}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs}
spec:
  selector: {app: seaweedfs}
  ports: [{name: s3, port: 8333, targetPort: 8333}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: create-bucket}
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: curl
          image: docker.io/curlimages/curl:8.16.0
          imagePullPolicy: IfNotPresent
          command: [sh, -c, "curl -fsS -X PUT http://seaweedfs:8333/chroma-storage && curl -fsS http://seaweedfs:8333/chroma-storage >/dev/null"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    operator: chroma-operator
  name: chroma-operator-operator-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chroma-operator-operator-role
subjects:
- kind: ServiceAccount
  name: chroma-operator
  namespace: chroma-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    operator: chroma-operator
    operator-deployment: kubernetes-operator
  name: chroma-operator-operator
  namespace: chroma-operator-system
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      operator: chroma-operator
      operator-deployment: kubernetes-operator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        operator: chroma-operator
        operator-deployment: kubernetes-operator
    spec:
      containers:
      - env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: ASPNETCORE_HTTP_PORTS
          value: "8080"
        - name: CHROMA_DEFAULT_IMAGE
          value: docker.io/chromadb/chroma:1.5.9
        - name: CHROMA_ALLOWED_IMAGES
          value: docker.io/chromadb/chroma,ghcr.io/chroma-core/chroma
        image: ghcr.io/chromadotnet/chroma-operator:dev
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
        name: operator
        ports:
        - containerPort: 8080
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: chroma-operator
      terminationGracePeriodSeconds: 10

# A tag vX.Y.Z publishes the release: the image for amd64 and arm64 on ghcr.io/chromadotnet/chroma-operator:X.Y.Z, and the
# manifest deploy/chroma-operator.yaml with that image, attached to the GitHub release of the tag.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        run: |
          version=${GITHUB_REF_NAME#v}
          docker buildx build --platform linux/amd64,linux/arm64 --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$version" -t "ghcr.io/chromadotnet/chroma-operator:$version" --push .
      - name: Manifest
        run: bash build/manifest.sh "${GITHUB_REF_NAME#v}"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" deploy/chroma-operator.yaml --title "$GITHUB_REF_NAME" --notes-file "build/release-notes.md" --verify-tag

# A tag vX.Y.Z publishes the release: the image for amd64 and arm64 on ghcr.io/chromadotnet/chroma-operator:X.Y.Z, with its build
# provenance and its Sigstore signature, and the manifest deploy/chroma-operator.yaml with that image, attached to the GitHub release
# of the tag.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Only the version tags may deploy to this environment.
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        id: image
        run: |
          version=${GITHUB_REF_NAME#v}
          docker buildx build --platform linux/amd64,linux/arm64 --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$version" -t "ghcr.io/chromadotnet/chroma-operator:$version" --push \
            --metadata-file "$RUNNER_TEMP/metadata.json" .
          echo "digest=$(jq -r '.["containerimage.digest"]' "$RUNNER_TEMP/metadata.json")" >> "$GITHUB_OUTPUT"
      - name: Build provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/chromadotnet/chroma-operator
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sigstore signature of the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/chromadotnet/chroma-operator@$DIGEST"
      - name: Manifest
        run: bash build/manifest.sh "${GITHUB_REF_NAME#v}"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" deploy/chroma-operator.yaml --title "$GITHUB_REF_NAME" --notes-file "build/release-notes.md" --verify-tag
